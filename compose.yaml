# Local development stack. Production is a single Go binary with the frontend
# embedded (PRD §12), so nothing here is deployed as-is.
#
#   cp .env.example .env
#   docker compose up --watch

name: syllabooks

x-database-url: &database-url postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?sslmode=disable

services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 5s
      retries: 15

  backend:
    build: ./backend
    environment:
      DATABASE_URL: *database-url
      # The address the browser uses; OAuth redirect URIs are built from it.
      PUBLIC_URL: http://localhost:${HTTP_PORT:-8000}
      YANDEX_CLIENT_ID: ${YANDEX_CLIENT_ID:-}
      YANDEX_CLIENT_SECRET: ${YANDEX_CLIENT_SECRET:-}
      VK_CLIENT_ID: ${VK_CLIENT_ID:-}
      # Lets `docker compose exec backend go tool goose <command>` run without flags.
      GOOSE_DRIVER: postgres
      GOOSE_DBSTRING: *database-url
      GOOSE_MIGRATION_DIR: db/migrations
    volumes:
      - ./backend:/app
      - go-build-cache:/root/.cache/go-build
    depends_on:
      db:
        condition: service_healthy
    develop:
      watch:
        - path: ./backend
          action: restart

  frontend:
    build: ./frontend
    init: true
    volumes:
      - ./frontend:/app
      - /app/node_modules

  caddy:
    image: caddy:2.11-alpine
    ports:
      - "${HTTP_PORT:-8000}:80"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      - backend
      - frontend

volumes:
  pgdata:
  go-build-cache:
